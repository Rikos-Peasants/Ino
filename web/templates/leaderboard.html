<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard · Ino</title>
<meta name="description" content="Image scores for the Just Rayen server, ranked.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/static/img/ino-mark.png">
<!-- Preloaded: the display face is needed for first paint, and
     discovering it inside the stylesheet costs a second round trip. -->
<link rel="preload" href="/static/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/riko.css?v={{V}}">
</head>
<body>

<!--NAV-->

<main class="wrap" id="main">
  <div class="page-head">
    <h1>Leaderboard</h1>
    <p>Scores come from reactions on images posted in the art channels. One point per net upvote, counted the moment someone reacts.</p>
    <dl class="stats stats--tight">
      <div><dt>Ranked members</dt><dd>{{STAT_MEMBERS}}</dd></div>
      <div><dt>Images scored</dt><dd>{{STAT_IMAGES}}</dd></div>
    </dl>
  </div>

  <ul class="cast cast--single">
    <!--RIKO-->
  </ul>

  <div class="table-tools">
    <a href="/leaderboard?sort=total_score" aria-current="{{SORT_TOTAL}}">Total score</a>
    <a href="/leaderboard?sort=image_count" aria-current="{{SORT_COUNT}}">Images posted</a>
    <a href="/leaderboard?sort=avg_score" aria-current="{{SORT_AVG}}">Average score</a>
  </div>

  <table class="board" id="board">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Name</th>
        <th scope="col" class="num">Score</th>
        <th scope="col" class="num">Images</th>
        <th scope="col" class="num">Average</th>
      </tr>
    </thead>
    <tbody>
      <!--ROWS-->
    </tbody>
  </table>
</main>

<!--FOOT-->
<script src="/static/js/site.js?v={{V}}" defer></script>
</body>
</html>
