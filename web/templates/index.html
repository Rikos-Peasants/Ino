<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ino</title>
<meta name="description" content="Leaderboards, art rankings and the donation goal for the Just Rayen Discord server.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Ino">
<meta property="og:description" content="Leaderboards, art rankings and the donation goal.">
<meta property="og:type" content="website">
<link rel="icon" href="/static/img/ino-mark.png">
<!-- Preloaded: the display face is needed for first paint, and
     discovering it inside the stylesheet costs a second round trip. -->
<link rel="preload" href="/static/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/riko.css?v={{V}}">
</head>
<body>

<!--NAV-->

<main id="main">

  <section class="hero">
    <div class="hero-copy">
      <h1>{{HERO_TITLE}}</h1>
      <p class="lede">{{HERO_LEDE}}</p>
      <div class="hero-actions">
        <a class="btn" href="/leaderboard">See the rankings</a>
        <a class="btn btn--ghost" href="/how-it-works">How it works</a>
      </div>

      <dl class="stats">
        <div><dt>Ranked members</dt><dd>{{STAT_MEMBERS}}</dd></div>
        <div><dt>Images scored</dt><dd>{{STAT_IMAGES}}</dd></div>
      </dl>
    </div>

    <div class="hero-art">
      <img src="/static/img/riko-think.png" alt="Riko with both hands raised" width="1032" height="1118" fetchpriority="high">
    </div>
  </section>

  <!-- Board and goal side by side. The board is the substance of the page and
       the goal is a narrow panel beside it, rather than two equal cards in a
       row of three identical ones. -->
  <section class="split wrap">
    <div class="split-main">
      <div class="section-head">
        <h2>Standing right now</h2>
        <a href="/leaderboard">Full leaderboard</a>
      </div>
      <ol class="mini-board">
        <!--TOP_ROWS-->
      </ol>
    </div>

    <aside class="goal-panel">
      <p class="goal-panel-label">Current goal</p>
      <h2>{{GOAL_TITLE}}</h2>
      <p class="goal-panel-figure"><strong>${{RAISED}}</strong> of ${{GOAL}}</p>
      <div class="goal-panel-track" role="progressbar" aria-valuenow="{{PERCENT}}" aria-valuemin="0" aria-valuemax="100" aria-label="Funding progress">
        <i style="width:{{PERCENT}}%"></i>
      </div>
      <p class="goal-panel-pct">{{PERCENT}}%</p>
      <a class="btn btn--sm" href="/donations">See the goal</a>
    </aside>
  </section>

  <section class="section wrap" data-reveal>
    <div class="section-head">
      <h2>Who you are dealing with</h2>
      <a href="/donations">See them react</a>
    </div>
    <ul class="cast-grid">
      <!--CAST_GRID-->
    </ul>
  </section>

</main>

<!--FOOT-->
<script src="/static/js/site.js?v={{V}}" defer></script>
</body>
</html>
